<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#F7F9FC" />
    <title>Welcome — Conninter</title>
    <link rel="stylesheet" href="css/shell.css" />
  </head>
  <body>
    <main class="onboarding">
      <div class="onboarding-top">
        <button type="button" id="skip-btn" class="skip">Skip</button>
      </div>
      <div id="track" class="track" role="region" aria-label="Onboarding slides"></div>
      <div class="onboarding-footer">
        <div id="dots" class="dots" aria-hidden="true"></div>
        <button type="button" id="next-btn" class="primary-btn">Next</button>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/onboarding.js"></script>
  </body>
</html>
